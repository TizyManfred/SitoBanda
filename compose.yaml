services:
  php:
    image: php:8.2-apache
    volumes:
      - ./src:/var/www/html
    ports:
      - "11001:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:9.3
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: