services:
  app:
    image: bitnami/laravel:latest
    ports:
      - '11001:11001'
    env_file:
      - ./src/.env
    volumes:
      - ./src:/app
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:10.6.20
    env_file:
      - ./src/.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: