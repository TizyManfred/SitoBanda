services:
  app:
    image: bitnami/laravel:latest
    ports:
      - '11001:11001'
    environment:
      - LARAVEL_PORT_NUMBER=11001
      - LARAVEL_SKIP_DATABASE=yes
    volumes:
      - ./src:/app
    depends_on:
      - database

  database:
    image: mysql:latest
    env_file:
      - ./src/.env
    volumes:
      - ./mysql_data:/var/lib/mysql

volumes:
  mysql_data: